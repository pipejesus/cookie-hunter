<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-label="Cookie Hunter — a googly-eyed blue monster detective inspecting a cookie with a magnifying glass">
  <defs>
    <filter id="fur" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
    </filter>
  </defs>

  <!-- crumb trail: the evidence -->
  <g fill="#c08a4d">
    <circle cx="120" cy="392" r="4"/>
    <circle cx="160" cy="405" r="3"/>
    <circle cx="205" cy="396" r="5"/>
    <circle cx="255" cy="408" r="3"/>
    <circle cx="310" cy="399" r="4"/>
    <circle cx="360" cy="392" r="3"/>
  </g>

  <!-- fuzzy blue monster -->
  <g filter="url(#fur)">
    <circle cx="230" cy="215" r="112" fill="#2a7de1"/>
    <!-- arm reaching for the magnifying glass -->
    <path d="M305 265 Q355 315 393 352" stroke="#2a7de1" stroke-width="28" stroke-linecap="round" fill="none"/>
  </g>

  <!-- open mouth (cookie anticipation) -->
  <path d="M152 228 Q230 208 308 225 Q302 302 228 308 Q158 298 152 228 Z" fill="#12181f"/>
  <ellipse cx="233" cy="290" rx="42" ry="15" fill="#d64550"/>

  <!-- googly eyes, professionally misaligned -->
  <circle cx="185" cy="98" r="36" fill="#ffffff" stroke="#c9d1d9" stroke-width="2"/>
  <circle cx="267" cy="93" r="40" fill="#ffffff" stroke="#c9d1d9" stroke-width="2"/>
  <circle cx="198" cy="110" r="10" fill="#12181f"/>   <!-- locked on the cookie -->
  <circle cx="282" cy="76" r="11" fill="#12181f"/>    <!-- locked on... something else -->

  <!-- deerstalker hat, resting on the eyeballs -->
  <g transform="rotate(-8 226 50)">
    <path d="M162 58 Q226 -14 290 58 Z" fill="#9c6b3f"/>
    <path d="M162 58 Q226 30 290 58 L290 66 Q226 42 162 66 Z" fill="#7a5230"/>
    <ellipse cx="297" cy="60" rx="25" ry="9" fill="#7a5230"/>
    <ellipse cx="155" cy="60" rx="25" ry="9" fill="#7a5230"/>
    <circle cx="226" cy="8" r="7" fill="#7a5230"/>
  </g>

  <!-- the suspect: one chocolate-chip cookie -->
  <circle cx="472" cy="295" r="36" fill="#d9a05b" stroke="#b9803e" stroke-width="3"/>
  <g fill="#5a3a22">
    <circle cx="460" cy="283" r="5"/>
    <circle cx="484" cy="290" r="4"/>
    <circle cx="468" cy="308" r="5"/>
    <circle cx="488" cy="310" r="3"/>
    <circle cx="452" cy="300" r="3"/>
  </g>

  <!-- magnifying glass over it -->
  <circle cx="472" cy="292" r="56" fill="#bfe0ff" fill-opacity="0.30" stroke="#5a6572" stroke-width="9"/>
  <line x1="431" y1="331" x2="401" y2="360" stroke="#5a6572" stroke-width="14" stroke-linecap="round"/>
  <circle cx="398" cy="358" r="18" fill="#2a7de1" filter="url(#fur)"/>

  <!-- wordmark -->
  <text x="320" y="400" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="3" fill="#2a7de1">COOKIE HUNTER</text>
  <text x="320" y="432" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#7d8590">C is for Compliance.</text>
</svg>
