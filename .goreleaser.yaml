version: 2

builds:
  - env:
      - CGO_ENABLED=0 # fully static — no runtime deps, unzip and run
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
