name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Ubuntu 24.04 runners: AppArmor blocks unprivileged user namespaces,
      # which kills Chrome's sandbox — re-allow them so the runtime test runs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
